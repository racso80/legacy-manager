<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0d0f14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Legacy Manager — Construye tu club. Forja tu legado." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Legacy Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        width: 100%;
        background: #0d0f14;
        font-family: system-ui, -apple-system, sans-serif;
        color: #e8eaf0;
        overflow: hidden;
      }
      #root {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100dvh;
        max-width: 540px;
        margin: 0 auto;
        overflow: hidden;
        position: relative;
      }
      /* Loading spinner */
      #loading {
        position: fixed;
        inset: 0;
        background: #0d0f14;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        gap: 16px;
        transition: opacity .3s;
      }
      #loading.hidden { opacity: 0; pointer-events: none; }
      .spinner {
        width: 40px; height: 40px;
        border: 3px solid rgba(201,168,76,.2);
        border-top-color: #c9a84c;
        border-radius: 50%;
        animation: spin .8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="loading">
      <svg width="52" height="59" viewBox="0 0 150 170" xmlns="http://www.w3.org/2000/svg" style="margin-bottom:8px">
        <path d="M75 4 L140 24 V78 C140 122 112 152 75 166 C38 152 10 122 10 78 V24 Z" fill="#c9a84c" />
        <path d="M75 14 L131 31 V78 C131 116 107 142 75 155 C43 142 19 116 19 78 V31 Z" fill="#0d0f14" stroke="#c9a84c" stroke-width="1.5" />
        <path d="M75,61 L80.6,77.3 L97.8,77.6 L84,87.9 L89.1,104.4 L75,94.5 L60.9,104.4 L66,87.9 L52.2,77.6 L69.4,77.3 Z" fill="#c9a84c" />
      </svg>
      <div style="font-size:18px;font-weight:700;letter-spacing:3px;color:#c9a84c">LEGACY</div>
      <div style="font-size:18px;font-weight:200;letter-spacing:5px;color:#e8eaf0">MANAGER</div>
      <div class="spinner" style="margin-top:24px"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
